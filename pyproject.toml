[project]
name = "llm-eval"
version = "0.1.0"
description = "Local-first eval framework for LLM applications"
requires-python = ">=3.11"
dependencies = [
    "typer >=0.12",
    "rich >= 13", 
    "openai >=1.0",
    "anthropic >=0.30",
    "numpy >= 1.24",
]

[project.optional-dependencies]
dev = ["pytest >= 8", "pytest-asyncio>=0.23"]

[project.scripts]
llm-eval = "llm_eval.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"